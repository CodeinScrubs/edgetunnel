# Wrangler-deploy config for the cloudflare:sockets build of the worker.
#
# Deploy with:
#   wrangler deploy -c wrangler_deploy_method_worker/wrangler.toml
#
# This build uses the documented `import { connect } from "cloudflare:sockets"` API and
# MUST be deployed with Wrangler. Do NOT paste it into the Dashboard "Edit Code" box —
# the Dashboard mishandles the cloudflare:sockets import and the worker returns Error 1101.
# (For Dashboard copy-paste, use ../_worker_copypaste.js instead.)
#
# Hard rules learned from the wrangler-deploy session:
#  - compatibility_date must be TODAY or EARLIER. A future date is rejected by wrangler.
#  - keep_vars = true stops wrangler from wiping vars you set in the Dashboard.
#  - wrangler OVERWRITES the remote worker's config with this file. If the KV binding and
#    the custom-domain route are not listed here, wrangler REMOVES them from the worker.
#  - Verify name / KV id / route below match YOUR account before the first deploy.

name = "t-v3"   # FRESH test name — do NOT set this back to "newera" (that worker is the one 1101ing)
main = "_worker.js"
compatibility_date = "2026-06-30"        # today-or-earlier only; never a future date
keep_vars = true

# No cron triggers: automated ProxyIP scanning probes many Cloudflare IPs and gets flagged
# as network abuse. Keep any ProxyIP scanning manual-only.

# KV namespace — required for the worker's KV features (logging, caches). Without this block
# wrangler will remove the KV binding from the deployed worker.
#[[kv_namespaces]]
#binding = ""                                  # binding name the worker reads; keep as "KV"
#id = ""        # Dashboard > Workers & Pages > KV

# Custom domain (optional). Without this block wrangler removes the route on deploy.
# Uncomment and set your hostname:
# [[routes]]
# pattern = "your.domain.example"
# custom_domain = true
